name: test

on:
  push:
    branches: [main, feature-memory-evolution]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv build
      - run: uv run syvrio --help
      - run: uv run syvrio --version
      - run: uv run qm --help
      - run: uv run quietmemo --version
      - run: uv run python -c "import syvrio; import quiet_memo; from syvrio.app.cli import app"
      - name: Test packaged wheel
        if: runner.os != 'Windows'
        run: |
          uv venv /tmp/syvrio-wheel
          uv pip install --python /tmp/syvrio-wheel/bin/python dist/*.whl
          /tmp/syvrio-wheel/bin/syvrio --help
          /tmp/syvrio-wheel/bin/qm --version
          /tmp/syvrio-wheel/bin/quietmemo --help
