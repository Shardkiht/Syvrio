name: publish-syvrio-manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    # PyPI trusted publisher for syvrio must be configured before manual dispatch.
    runs-on: ubuntu-latest
    container: debian:13-slim
    environment:
      name: pypi
      url: https://pypi.org/p/syvrio
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Install Debian prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git libstdc++6
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --frozen

      - name: Test
        run: uv run pytest -q

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
